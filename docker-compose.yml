services:
  # Production container (Nginx + static optimized bundle)
  scheme-sathi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheme_sathi_app
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
